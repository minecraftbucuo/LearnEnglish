appId: com.learnenglish.desktop
productName: LearnEnglish
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LearnEnglish
npmRebuild: false
