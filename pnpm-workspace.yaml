allowBuilds:
  '@resvg/resvg-js': true
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: true

# pnpm ≥10 标准键：allowBuilds 在部分版本不生效，导致 electron 二进制下载脚本被跳过
onlyBuiltDependencies:
  - '@resvg/resvg-js'
  - better-sqlite3
  - electron
  - esbuild
  - koffi

overrides:
  '@electron/get': ^3.1.0

patchedDependencies:
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch
